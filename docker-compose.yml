# Локальный Postgres для SQL-бота (!bot_SQL/). Прод/VPS не трогаем.
# Запуск: docker compose up -d
# Остановка: docker compose down  (данные в volume сохраняются)

services:
  postgres:
    image: postgres:16-alpine
    container_name: life_dashboard_pg
    environment:
      POSTGRES_USER: life
      POSTGRES_PASSWORD: life
      POSTGRES_DB: life_dashboard
    ports:
      - "5432:5432"
    volumes:
      - life_dashboard_pg_data:/var/lib/postgresql/data
      # При первом старте контейнера Postgres сам выполнит schema.sql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  life_dashboard_pg_data:
